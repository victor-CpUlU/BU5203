<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI-Assisted Credit Analysis</title>
  <link rel="stylesheet" href="/css/app.css">
  <script src="/vendor/chart.umd.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="topbar">
    <div class="brand">
      <h1><a href="#/">AI-Assisted Credit Analysis</a></h1>
      <p class="sub">BU5203 prototype: the AI drafts, Python calculates and checks, the analyst decides.</p>
    </div>
    <div class="topbar-right">
      <label for="analyst-name">Analyst name</label>
      <input id="analyst-name" type="text" maxlength="100" autocomplete="name" placeholder="Your name">
      <span id="llm-status" class="badge"></span>
      <button id="close-app" type="button" class="secondary">Close app</button>
    </div>
  </header>
  <div id="notice" class="notice" role="note"></div>
  <div class="layout">
    <nav id="steps" aria-label="Pipeline sections"></nav>
    <main id="main" tabindex="-1"></main>
  </div>
  <div id="status" class="sr-status" role="status" aria-live="polite"></div>
  <div id="toast" class="toast" role="alert" hidden></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
