# Analysis settings. Thresholds are tolerances for labelling and review flags, not credit benchmarks.

max_upload_mb = 200      # largest PDF accepted per upload (annual reports with images can exceed 50 MB)
max_csv_mb = 5
page_limit = 30          # pages per extraction request (1-200)
llm_timeout_s = 600      # seconds to wait for one AI response; Sections 3 and 5 can take over 2 minutes with the Kiro CLI
llm_max_retries = 2

[large_swing]            # change between adjacent periods that raises a "large swing" flag
percent = 10.0           # percentage points
multiple = 2.0           # x
days = 5.0               # days
amount = 50.0            # % of the absolute earlier value

[stable_band]            # change within the band is labelled "~"
percent = 1.0
multiple = 0.10
days = 3.0
amount = 5.0

[forecast]               # backend forecast and scenario analysis (Section 3). All values are illustrative starting points;
                         # the analyst edits every assumption per deal in the dashboard.
facility_rate = 6.0                     # default interest rate on the requested facility, % per year
default_horizon_quarters = 8            # used when the tenor cannot be read from the deal intake
max_horizon_quarters = 20               # longest forecast the dashboard allows
short_term_debt_repayment_quarters = 4  # existing short-term debt is repaid evenly over this many quarters

[forecast.upside]        # added to the base case (percentage points; interest_change is a % change)
revenue_growth = 2.0
ebitda_margin = 2.0
capex_pct_revenue = -1.0
interest_change = -10.0
facility_rate = -0.5

[forecast.downside]
revenue_growth = -5.0
ebitda_margin = -5.0
capex_pct_revenue = 2.0
interest_change = 25.0
facility_rate = 2.0

[keywords]
business = [
  "item 1. business", "business overview", "our business", "business model", "segment", "segments",
  "products", "customers", "suppliers", "manufacturing", "foundry", "capital expenditure",
  "investment", "geographic", "competition", "executive officers", "board of directors",
  "ownership", "revenue by", "net revenue", "strategy",
]
debt = [
  "debt", "borrowings", "notes due", "senior notes", "credit facility", "revolving",
  "commercial paper", "maturities", "interest expense", "covenant", "secured", "unsecured",
  "refinanc", "financing arrangements", "term loan", "liquidity and capital resources",
]
